<text fill="#222222"  xml:space="preserve" font-size="28.2286" transform="translate(85.7143, 97.0601)" >BALANCED TERNARY MULTIPLY-ADD / X + A*B + Cin = Sum + 3*Cout</text>
<text fill="#222222"  xml:space="preserve" font-size="17.8286" transform="translate(85.7143, 173.331)" >Combinational 1-trit slice: mul -&gt; full_adder. No state, accumulator, or mode MUX.</text>
<text fill="#222222"  xml:space="preserve" font-size="17.8286" transform="translate(85.7143, 1316.19)" >B=+5 V: X+A+Cin (ADD/FA); B=-5 V: X-A+Cin (SUB).</text>
